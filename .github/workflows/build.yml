name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || '0.0.0' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TypingAuto run_app.py

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${env:APP_VERSION}" packaging\windows\TypingAuto.iss

      - name: Build Windows portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\TypingAuto.exe -DestinationPath dist\TypingAuto-windows-portable.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TypingAuto-windows
          path: |
            dist/TypingAuto-windows-setup.exe
            dist/TypingAuto-windows-portable.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build Linux executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name TypingAuto run_app.py

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packaging/deb-root
          install -Dm755 dist/TypingAuto packaging/deb-root/opt/typing-auto/TypingAuto
          install -Dm644 packaging/linux/typing-auto.desktop packaging/deb-root/usr/share/applications/typing-auto.desktop
          mkdir -p packaging/deb-root/usr/bin
          ln -s /opt/typing-auto/TypingAuto packaging/deb-root/usr/bin/typing-auto
          install -d packaging/deb-root/DEBIAN
          cat > packaging/deb-root/DEBIAN/control <<EOF
          Package: typing-auto
          Version: ${APP_VERSION#v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Typing Auto <noreply@github.com>
          Description: Local, visible keyboard text entry tool
           Stores snippets locally and types them through the operating system keyboard interface.
          EOF
          dpkg-deb --build --root-owner-group packaging/deb-root dist/TypingAuto-linux.deb

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/TypingAuto.AppDir
          install -Dm755 dist/TypingAuto dist/TypingAuto.AppDir/usr/bin/typing-auto
          install -Dm644 packaging/linux/typing-auto.desktop dist/TypingAuto.AppDir/usr/share/applications/typing-auto.desktop
          install -Dm755 packaging/linux/AppRun dist/TypingAuto.AppDir/AppRun
          curl -fsSL -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          ARCH=x86_64 /tmp/appimagetool.AppImage dist/TypingAuto.AppDir dist/TypingAuto-linux.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TypingAuto-linux
          path: |
            dist/TypingAuto-linux.deb
            dist/TypingAuto-linux.AppImage

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: TypingAuto-windows
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: TypingAuto-linux
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
